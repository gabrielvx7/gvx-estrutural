<!doctype html>
<html lang="pt-BR">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GVX Engenharia - Orçamentos</title>
  <link rel="stylesheet" href="./src/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
  <body>

    <!-- TELA INICIAL (SPLASH / MENU PRINCIPAL) -->
    <div id="telaInicio" class="home-screen">
      <!-- Logotipo da Marca -->
      <div class="home-brand">
        <!-- Substitua a imagem abaixo pela sua logo se preferir, ou use o container estrutural -->
        <div class="logo-graphic">
          <div style="background: #0b192c; height: 35%; width: 100%; border-radius: 4px;"></div>
          <div style="background: #d4af37; height: 30%; width: 90%; margin: 4px auto; border-radius: 4px;"></div>
          <div style="background: #0b192c; height: 35%; width: 80%; margin: 0 auto; border-radius: 4px;"></div>
        </div>
        <h1>GABRIEL VASCONCELOS</h1>
        <p>PROJETOS ESTRUTURAIS</p>
      </div>

      <!-- Botões de Acesso -->
      <div class="home-buttons">
        <button id="btnIrNovo" class="home-card-btn">
          <div class="card-icon">🏛️</div>
          <span>NOVO ORÇAMENTO</span>
        </button>

        <button id="btnIrHistorico" class="home-card-btn">
          <div class="card-icon">📋</div>
          <span>HISTÓRICO</span>
        </button>
      </div>
    </div>


    <!-- CONTAINER PRINCIPAL DO APLICATIVO (Oculto inicialmente) -->
    <div id="appContainer" class="app-container hidden">
      
      <!-- CABEÇALHO DO APP -->
      <div class="app-header">
        <div class="brand-box">
          <button id="btnVoltarInicio" class="btn-back" title="Voltar ao Início">⬅</button>
          <div class="brand-logo">GVX</div>
          <div>
            <h2 class="brand-title">GVX ENGENHARIA</h2>
            <p class="brand-sub">Sistema de Orçamentos</p>
          </div>
        </div>
        <!-- ABAS DE NAVEGAÇÃO -->
        <div class="tabs">
          <button id="tabNovo" class="tab-btn active">Novo</button>
          <button id="tabHistorico" class="tab-btn">Histórico</button>
        </div>
      </div>

      <!-- CONTEÚDO DA ABA: NOVO ORÇAMENTO -->
      <div id="secaoNovo" class="section-content">
        <div class="form-row">
          <div class="form-group">
            <label>Número do Orçamento</label>
            <input type="text" id="numOrcamento" value="001/2026" class="form-input" />
          </div>
          <div class="form-group">
            <label>Data</label>
            <input type="date" id="dataOrcamento" class="form-input" />
          </div>
        </div>

        <div class="form-group">
          <label>Nome do Cliente</label>
          <input type="text" id="cliente" placeholder="Ex: João da Silva" class="form-input" />
        </div>

        <div class="form-group">
          <label>Descrição da Obra</label>
          <input type="text" id="descricaoObra" placeholder="Ex: Residência Unifamiliar - 2 Pavimentos" class="form-input" />
        </div>

        <div class="params-box">
          <div class="form-group">
            <label>Área (m²)</label>
            <input type="number" id="areaConstruida" value="100" class="form-input" />
          </div>
          <div class="form-group">
            <label>Preço/m² (R$)</label>
            <input type="number" id="precoMetro" value="25" class="form-input" />
          </div>
          <div class="form-group">
            <label>Nota Fiscal (%)</label>
            <input type="number" id="notaFiscal" value="0" class="form-input" />
          </div>
        </div>

        <div>
          <label style="font-size: 12px; font-weight: bold; color: #334155; display: block; margin-bottom: 8px; text-transform: uppercase;">Fatores de Complexidade</label>
          <div id="listaComplexidades" class="complex-list"></div>
        </div>

        <div class="total-box">
          <div>
            <span>Valor Total do Projeto</span>
            <h2 id="resPrecoFinal">R$ 0,00</h2>
          </div>
          <button id="btnGerarPdf" class="btn-action">
            📥 Gerar Imagem A4
          </button>
        </div>
      </div>

      <!-- CONTEÚDO DA ABA: HISTÓRICO DE ORÇAMENTOS -->
      <div id="secaoHistorico" class="section-content hidden">
        <label style="font-size: 12px; font-weight: bold; color: #334155; text-transform: uppercase;">Orçamentos Emitidos</label>
        <div id="listaHistorico" class="history-list"></div>
      </div>

    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
